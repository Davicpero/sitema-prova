        <h2>Entidade 3</h2> <!-- >>> ALTERAR: título da tela -->
        <h3>Novo Cadastro</h3>
        <!-- >>> ALTERAR: texto do <label>, for, name e id (name = coluna do banco) -->

            <label for="campo1">Campo 1</label>
            <input type="text" name="campo1" id="campo1" maxlength="100" required>
            <label for="campo2">Campo 2 (número)</label>
            <input type="number" name="campo2" id="campo2" min="0" step="1" required>
            <button type="submit" disabled>Salvar</button>
        </form>

        <table>
            <caption>Lista de entidade 3</caption> <!-- >>> ALTERAR: legenda -->

                <tr>
                    <!-- >>> ALTERAR: cabeçalhos das colunas -->

                    <th>Campo 2</th>

                </tr>
